services:
  entorno_curso:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID}:${GID}"
    container_name: python_notes_314
    volumes:
      - .:/app
      # Esta línea comparte tus llaves SSH del host dentro del contenedor de forma segura
      - ~/.ssh:/home/node/.ssh:ro
    working_dir: /app
    tty: true
    stdin_open: true
    command: bash